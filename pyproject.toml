[build-system]
requires = ["maturin>=1.5"]
build-backend = "maturin"

[project]
name = "netsmith"
version = "0.3.0"
description = "Fast network analysis library with Rust acceleration"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name = "Kyle T. Jones", email = "kyle@kyletjones.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Intended Audience :: Science/Research",
]

# Main dependencies
dependencies = [
    "numpy>=1.23,<3.0.0",
]

# Optional dependencies
[project.optional-dependencies]
rust = []  # Rust backend (installed automatically if available)
scipy = ["scipy>=1.9,<2.0.0"]  # For sparse matrices and advanced stats
pandas = ["pandas>=1.5,<3.0.0"]
polars = ["polars>=0.20,<1.0.0"]
networkx = ["networkx>=3.0,<4.0.0"]  # Interop only: Graph.as_networkx(). No algorithm needs it.
# The `netsmith` command needs click to run and pandas/pyarrow to write its
# Parquet output. Declared here rather than as a hard dependency so importing
# the library stays lean.
cli = ["click>=8.0", "pandas>=1.5,<3.0.0", "pyarrow>=12.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
    "isort>=5.12",
    "click>=8.0",       # Required by the netsmith CLI and its tests
    "pandas>=1.5,<3.0.0",  # CLI writes Parquet output through pandas
    "pyarrow>=12.0",       # Parquet engine for the CLI round-trip tests
]

[project.scripts]
netsmith = "netsmith.apps.cli:main"

# Maturin configuration for Rust extension
[tool.maturin]
manifest-path = "./rust/Cargo.toml"
features = ["python"]  # pyo3 is optional so `cargo test` links without libpython
python-source = "src"
python-packages = ["netsmith"]
release = true
strip = true
sdist-include = ["LICENSE", "README.md", "CHANGELOG.md"]

# Setuptools configuration for src/ layout
[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]

# MyPy configuration
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "netsmith_rs.*",
    "netsmith_rs",
]
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[dependency-groups]
dev = [
    "maturin>=1.13.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "click>=8.0",
    "pandas>=1.5,<3.0.0",
    "pyarrow>=12.0",
]
